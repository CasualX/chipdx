name: Build Binaries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: AppImage release tag
        type: string
        required: false

jobs:
  win32:
    runs-on: windows-latest
    steps:
    - name: Checkout Sources
      uses: actions/checkout@v7

    - name: Install Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Build Package
      run: cargo run --release -p publish -- target/publish

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: chipdx-win32
        if-no-files-found: error
        path: target/publish/**

  linux-appimage:
    runs-on: ubuntu-24.04
    # The container defines the ABI baseline, independently of the runner OS.
    container: ubuntu:20.04
    steps:
    - name: Checkout Sources
      uses: actions/checkout@v7

    - name: Install Linux Build Dependencies
      run: bash packaging/appimage/dependencies.sh

    - name: Install Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Build AppImage (glibc 2.31 baseline)
      env:
        CHIPDX_RELEASE_TAG: ${{ inputs.release_tag }}
      run: bash packaging/appimage/build.sh

    - name: Upload AppImage
      uses: actions/upload-artifact@v7
      with:
        name: chipdx-appimage-x86_64
        if-no-files-found: error
        path: target/appimage/dist/*

  linux-smoke-test:
    needs: linux-appimage
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu:20.04
        - ubuntu:22.04
        - ubuntu:24.04
        - ubuntu:26.04
        - debian:11
        - debian:12
        - debian:13
        - fedora:44
        - fedora:45
        backend: [x11-fallback, wayland]
    container: ${{ matrix.os }}
    steps:
    - name: Install Fedora Desktop Runtime for Smoke Test
      if: startsWith(matrix.os, 'fedora:')
      run: |
        dnf install -y --setopt=install_weak_deps=False git tar xorg-x11-server-Xvfb \
          weston mesa-dri-drivers mesa-libEGL mesa-libGL libwayland-client libwayland-cursor \
          libwayland-egl libxkbcommon xkeyboard-config gtk3 libnotify

    - name: Checkout Sources
      uses: actions/checkout@v7

    - name: Download AppImage
      uses: actions/download-artifact@v8
      with:
        name: chipdx-appimage-x86_64
        path: appimage

    - name: Use Archived Debian 11 Repositories
      if: matrix.os == 'debian:11'
      run: |
        # Bullseye security indexes on the live mirror reference removed files.
        # This compatibility job needs the archived package set, signed as usual.
        rm -f /etc/apt/sources.list.d/debian.sources
        cat > /etc/apt/sources.list <<'EOF'
        deb http://archive.debian.org/debian bullseye main
        deb [check-valid-until=no] http://archive.debian.org/debian-security bullseye-security main
        EOF

    - name: Install Debian and Ubuntu Desktop Runtime for Smoke Test
      if: ${{ !startsWith(matrix.os, 'fedora:') }}
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          xvfb xauth weston libgl1-mesa-dri libglx-mesa0 libegl1 \
          libwayland-client0 libwayland-cursor0 libwayland-egl1 \
          libxkbcommon0 xkb-data libgtk-3-0 libnotify4

    - name: Verify Checksum and Launch Game Without FUSE
      run: |
        cd appimage
        sha256sum -c ChipDX-x86_64.AppImage.sha256
        cd ..
        bash packaging/appimage/smoke-test.sh appimage/ChipDX-x86_64.AppImage '${{ matrix.backend }}'
        bash packaging/appimage/smoke-test.sh appimage/ChipDX-x86_64.AppImage '${{ matrix.backend }}' editor

    - name: Verify X11 With Host Keyboard Libraries
      if: matrix.os == 'ubuntu:22.04' && matrix.backend == 'x11-fallback'
      run: |
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libxkbcommon-x11-0
        bash packaging/appimage/smoke-test.sh appimage/ChipDX-x86_64.AppImage x11
        bash packaging/appimage/smoke-test.sh appimage/ChipDX-x86_64.AppImage x11 editor
